<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Quicksand:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Quicksand',system-ui,sans-serif; color:#fff8e8; padding:1.5rem;
    background: radial-gradient(ellipse at top,#123b7a 0%,#0b2350 45%,#06122e 100%); }
  .rainbow { position:fixed; top:0; left:0; right:0; height:8px;
    background:linear-gradient(90deg,#e2473b,#f0922f,#f2c14e,#3fae5a,#2a7de1,#5a3fb0,#a23fb0); }
  .card { width:100%; max-width:430px; text-align:center;
    background:linear-gradient(160deg,rgba(11,125,74,0.22),rgba(3,48,29,0.4));
    border:1px solid rgba(31,174,114,0.4); border-radius:22px; padding:2.6rem 1.8rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.45); }
  .slippers { font-size:3rem; filter:drop-shadow(0 0 14px rgba(224,39,74,0.8)); }
  h1 { font-family:'Cinzel Decorative',serif; font-size:1.7rem; margin:0.8rem 0 0.2rem; color:#fff; }
  .sub { font-size:0.95rem; opacity:0.85; margin-bottom:1.6rem; }
  label { display:block; font-size:0.8rem; letter-spacing:0.18em; text-transform:uppercase;
    color:#f2c14e; font-weight:700; margin-bottom:0.5rem; }
  input { width:100%; padding:0.85rem 1rem; border-radius:12px; border:1px solid rgba(242,193,78,0.5);
    background:rgba(255,255,255,0.08); color:#fff; font-size:1.05rem; text-align:center;
    font-family:inherit; }
  input:focus { outline:none; border-color:#1fae72; box-shadow:0 0 0 3px rgba(31,174,114,0.25); }
  button { margin-top:1rem; width:100%; padding:0.85rem 1rem; border:none; border-radius:12px;
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.02rem; cursor:pointer;
    color:#03301d; background:linear-gradient(90deg,#f2c14e,#d99e29); transition:transform .15s ease; }
  button:hover { transform:translateY(-1px); }
  button:disabled { opacity:0.6; cursor:default; transform:none; }
  .msg { min-height:1.3rem; margin-top:0.9rem; font-size:0.92rem; color:#e0274a; font-weight:600; }
  .hint { margin-top:1.4rem; font-size:0.8rem; opacity:0.6; }
</style>

</form>

  const ITER = 150000;

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function unlock(pw) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const gzBuf = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv:b64(IV) }, key, b64(DATA));
    // The payload is gzip-compressed; inflate it in the browser.
    const stream = new Blob([gzBuf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }

  const form = document.getElementById("gate");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (!pw) return;
    btn.disabled = true; msg.style.color = "#f2c14e"; msg.textContent = "Opening the gates of Oz…";
    try {
      const html = await unlock(pw);
      document.open(); document.write(html); document.close();
    } catch (err) {
      msg.style.color = "#e0274a";
      msg.textContent = "The Wicked Witch says: that's not the password!";
      btn.disabled = false;
    }
  });
