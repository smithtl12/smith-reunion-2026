<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tyosphere</title>

<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#eaf7f2; padding:1.5rem;
    background:radial-gradient(ellipse at top,#1387b0 0%,#0b5570 50%,#052736 100%); }
  .card { width:100%; max-width:430px; text-align:center;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.25); border-radius:22px; padding:2.6rem 1.8rem;
    box-shadow:0 24px 60px rgba(0,0,0,0.45); backdrop-filter:blur(6px); }
  .icon { font-size:3rem; }
  h1 { font-size:1.5rem; margin:0.8rem 0 0.2rem; color:#fff; }
  .sub { font-size:0.95rem; opacity:0.85; margin-bottom:1.6rem; }
  label { display:block; font-size:0.8rem; letter-spacing:0.18em; text-transform:uppercase;
    color:#9fdcef; font-weight:700; margin-bottom:0.5rem; }
  input { width:100%; padding:0.85rem 1rem; border-radius:12px; border:1px solid rgba(159,220,239,0.5);
    background:rgba(255,255,255,0.1); color:#fff; font-size:1.05rem; text-align:center; font-family:inherit; }
  input:focus { outline:none; border-color:#9fdcef; box-shadow:0 0 0 3px rgba(159,220,239,0.25); }
  button { margin-top:1rem; width:100%; padding:0.85rem 1rem; border:none; border-radius:12px;
    font-family:inherit; font-weight:700; font-size:1.02rem; cursor:pointer;
    color:#05242f; background:linear-gradient(90deg,#9fdcef,#4fb3d6); transition:transform .15s ease; }
  button:hover { transform:translateY(-1px); }
  button:disabled { opacity:0.6; cursor:default; transform:none; }
  .msg { min-height:1.3rem; margin-top:0.9rem; font-size:0.92rem; color:#ff9d9d; font-weight:600; }
</style>
</head>

  const ITER = 150000;

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function unlock(pw) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    const gzBuf = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv:b64(IV) }, key, b64(DATA));
    const stream = new Blob([gzBuf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }

  const form = document.getElementById("gate");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("go");
  const PW_KEY = "tyosphere_pw";

  async function open_(pw) {
    const html = await unlock(pw);
    try { localStorage.setItem(PW_KEY, pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (!pw) return;
    btn.disabled = true; msg.style.color = "#9fdcef"; msg.textContent = "Unlocking…";
    try {
      await open_(pw.trim().toLowerCase());
    } catch (err) {
      msg.style.color = "#ff9d9d";
      msg.textContent = "That's not the password — try again.";
      btn.disabled = false;
    }
  });

  // Remembered on this device? Skip the gate entirely.
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(PW_KEY); } catch (e) {}
    if (!saved) return;
    btn.disabled = true; msg.style.color = "#9fdcef"; msg.textContent = "Unlocking…";
    try { await open_(saved); }
    catch (err) {
      try { localStorage.removeItem(PW_KEY); } catch (e) {}
      msg.textContent = ""; btn.disabled = false;
    }
  })();
